potential_direction_transformation: 'It''s the first round, the user provided a potential
  direction: "{{ potential_direction }}". Referring to it, you need to transform it
  into a hypothesis in formal language that is clear and actionable for factor generation.
  Consider the following aspects while formulating the hypothesis:

  1. **Clarity**: Ensure the hypothesis is specific and unambiguous.

  2. **Actionability**: The hypothesis should suggest a clear path for experimentation
  or investigation.

  3. **Relevance**: Ensure the hypothesis is directly related to the potential direction
  provided by the user.'
hypothesis_output_format: "The output should follow JSON format. Do not add any other\
  \ text in your response. The schema is as follows:\n{\n\"hypothesis\": \"A SINGLE\
  \ LINE OF TEXT. The new hypothesis generated based on the information provided.\"\
  ,\n\"concise_knowledge\": \"A SINGLE LINE OF TEXT. Transferable knowledge based\
  \ on theoretical principles. Use conditional grammar. eg. 'If...., ..; When...,\
  \ .; and etc' Make sure that you state things clearly without ambiguity. Eg. avoid\
  \ saying 'previous hypothesis', because one wouldn't know what that is.\",\n\"concise_observation\"\
  : \"A SINGLE LINE OF TEXT. It focuses on the observation of the given scenario,\
  \ data characteristics, or previous experiences (failures & succeses).\",\n\"concise_justification\"\
  : \"A SINGLE LINE OF TEXT. Justify the hypothesis based on theoretical principles\
  \ or initial assumptions.\",\n\"concise_specification\": \"A SINGLE LINE OF TEXT.\
  \ Define the scope, conditions, constraints of the hypothesis. Specify the expected\
  \ relationships, variables, and thresholds, ensuring testability and relevance to\
  \ the observed data.\"\n  }"
factor_hypothesis_specification: "1. **Data-Driven Hypothesis Formation:**  \n  -\
  \ Ground hypotheses within the scope of available data for seamless testing.\n \
  \ - Align hypotheses with the temporal, cross-sectional, and distributional properties\
  \ of the data.\n  - Avoid overfitting by focusing on robust, economically intuitive,\
  \ and innovative relationships. \n\n2. **Justification of the Hypothesis:**  \n\
  \  - Use observed market patterns to creatively infer underlying economic or behavioral\
  \ drivers.\n  - Build on empirical evidence while exploring innovative connections\
  \ or untested relationships.\n  - Propose actionable insights that challenge conventional\
  \ assumptions, yet remain testable.\n  - Emphasize the factor's potential to uncover\
  \ unique, predictive market behaviors.\n\n3. **Continuous Optimization and Exploration:**\
  \  \n    - Refine the first hypothesis iteratively by testing across different variants.\
  \ \n    - Incorporate feedback from empirical results to enhance the factor's predictive\
  \ power."
function_lib_description: "Only the following operations are allowed in expressions:\
  \ \n### **Cross-sectional Functions**\n- **RANK(A)**: Ranking of each element in\
  \ the cross-sectional dimension of A.\n- **ZSCORE(A)**: Z-score of each element\
  \ in the cross-sectional dimension of A.\n- **MEAN(A)**: Mean value of each element\
  \ in the cross-sectional dimension of A.\n- **STD(A)**: Standard deviation in the\
  \ cross-sectional dimension of A.\n- **SKEW(A)**: Skewness in the cross-sectional\
  \ dimension of A.\n- **KURT(A)**: Kurtosis in the cross-sectional dimension of A.\n\
  - **MAX(A)**: Maximum value in the cross-sectional dimension of A.\n- **MIN(A)**:\
  \ Minimum value in the cross-sectional dimension of A.\n- **MEDIAN(A)**: Median\
  \ value in the cross-sectional dimension of A\n\n### **Time-Series Functions**\n\
  - **DELTA(A, n)**: Change in value of A over n periods.\n- **DELAY(A, n)**: Value\
  \ of A delayed by n periods.\n- **TS_MEAN(A, n)**: Mean value of sequence A over\
  \ the past n days.\n- **TS_SUM(A, n)**: Sum of sequence A over the past n days.\n\
  - **TS_RANK(A, n)**: Time-series rank of the last value of A in the past n days.\n\
  - **TS_ZSCORE(A, n)**: Z-score for each sequence in A over the past n days.\n- **TS_MEDIAN(A,\
  \ n)**: Median value of sequence A over the past n days.\n- **TS_PCTCHANGE(A, p)**:\
  \ Percentage change in the value of sequence A over p periods.\n- **TS_MIN(A, n)**:\
  \ Minimum value of A in the past n days.\n- **TS_MAX(A, n)**: Maximum value of A\
  \ in the past n days.\n- **TS_ARGMAX(A, n)**: The index (relative to the current\
  \ time) of the maximum value of A over the past n days.\n- **TS_ARGMIN(A, n)**:\
  \ The index (relative to the current time) of the minimum value of A over the past\
  \ n days.\n- **TS_QUANTILE(A, p, q)**: Rolling quantile of sequence A over the past\
  \ p periods, where q is the quantile value between 0 and 1.\n- **TS_STD(A, n)**:\
  \ Standard deviation of sequence A over the past n days.\n- **TS_VAR(A, p)**: Rolling\
  \ variance of sequence A over the past p periods.\n- **TS_CORR(A, B, n)**: Correlation\
  \ coefficient between sequences A and B over the past n days.\n- **TS_COVARIANCE(A,\
  \ B, n)**: Covariance between sequences A and B over the past n days.\n- **TS_MAD(A,\
  \ n)**: Rolling Median Absolute Deviation of sequence A over the past n days.\n\
  - **PERCENTILE(A, q, p)**: Quantile of sequence A, where q is the quantile value\
  \ between 0 and 1. If p is provided, it calculates the rolling quantile over the\
  \ past p periods.\n- **HIGHDAY(A, n)**: Number of days since the highest value of\
  \ A in the past n days.\n- **LOWDAY(A, n)**: Number of days since the lowest value\
  \ of A in the past n days.\n- **SUMAC(A, n)**: Cumulative sum of A over the past\
  \ n days.\n\n### **Moving Averages and Smoothing Functions**\n- **SMA(A, n, m)**:\
  \ Simple moving average of A over n periods with modifier m.\n- **WMA(A, n)**: Weighted\
  \ moving average of A over n periods, with weights decreasing from 0.9 to 0.9^(n).\n\
  - **EMA(A, n)**: Exponential moving average of A over n periods, where the decay\
  \ factor is 2/(n+1).\n- **DECAYLINEAR(A, d)**: Linearly weighted moving average\
  \ of A over d periods, with weights increasing from 1 to d.\n\n### **Mathematical\
  \ Operations**\n- **PROD(A, n)**: Product of values in A over the past n days. Use\
  \ `*` for general multiplication.\n- **LOG(A)**: Natural logarithm of each element\
  \ in A.\n- **SQRT(A)**: Square root of each element in A.\n- **POW(A, n)**: Raise\
  \ each element in A to the power of n.\n- **SIGN(A)**: Sign of each element in A,\
  \ one of 1, 0, or -1.\n- **EXP(A)**: Exponential of each element in A.\n- **ABS(A)**:\
  \ Absolute value of A.\n- **MAX(A, B)**: Maximum value between A and B.\n- **MIN(A,\
  \ B)**: Minimum value between A and B.\n- **INV(A)**: Reciprocal (1/x) of each element\
  \ in sequence A.\n- **FLOOR(A)**: Floor of each element in sequence A.\n\n### **Conditional\
  \ and Logical Functions**\n- **COUNT(C, n)**: Count of samples satisfying condition\
  \ C in the past n periods. Here, C is a logical expression, e.g., `$close > $open`.\n\
  - **SUMIF(A, n, C)**: Sum of A over the past n periods if condition C is met. Here,\
  \ C is a logical expression.\n- **FILTER(A, C)**: Filtering multi-column sequence\
  \ A based on condition C. Here, C is presented in a logical expression form, with\
  \ the same size as A.\n- **(C1)&&(C2)**: Logical operation \"and\". Both C1 and\
  \ C2 are logical expressions, such as A > B.\n- **(C1)||(C2)**: Logical operation\
  \ \"or\". Both C1 and C2 are logical expressions, such as A > B.\n- **(C1)?(A):(B)**:\
  \ Logical operation \"If condition C1 holds, then A, otherwise B\". C1 is a logical\
  \ expression, such as A > B.\n\n### **Regression and Residual Functions**\n- **SEQUENCE(n)**:\
  \ A single-column sequence of length n, ranging from 1 to integer n. `SEQUENCE()`\
  \ should always be nested in `REGBETA()` or `REGRESI()` as argument B.\n- **REGBETA(A,\
  \ B, n)**: Regression coefficient of A on B using the past n samples, where A MUST\
  \ be a multi-column sequence and B a single-column or multi-column sequence.\n-\
  \ **REGRESI(A, B, n)**: Residual of regression of A on B using the past n samples,\
  \ where A MUST be a multi-column sequence and B a single-column or multi-column\
  \ sequence.\n\n### **Technical Indicators**\n- **RSI(A, n)**: Relative Strength\
  \ Index of sequence A over n periods. Measures momentum by comparing the magnitude\
  \ of recent gains to recent losses.\n- **MACD(A, short_window, long_window)**: Moving\
  \ Average Convergence Divergence (MACD) of sequence A, calculated as the difference\
  \ between the short-term (short_window) and long-term (long_window) exponential\
  \ moving averages.\n- **BB_MIDDLE(A, n)**: Middle Bollinger Band, calculated as\
  \ the n-period simple moving average of sequence A.\n- **BB_UPPER(A, n)**: Upper\
  \ Bollinger Band, calculated as middle band plus two standard deviations of sequence\
  \ A over n periods.\n- **BB_LOWER(A, n)**: Lower Bollinger Band, calculated as middle\
  \ band minus two standard deviations of sequence A over n periods.\n\n\nNote that:\n\
  - Only the variables provided in data (e.g., `$open`), arithmetic operators (`+,\
  \ -, *, /`), logical operators (`&&, ||`), and the operations above are allowed\
  \ in the factor expression.\n- Make sure your factor expression contain at least\
  \ one variables within the dataframe columns (e.g. $open), combined with registered\
  \ operations above. Do NOT use any undeclared variable (e.g. 'n', 'w_1') and undefined\
  \ symbols (e.g., '=') in the expression. \n- Pay attention to the distinction between\
  \ operations with the TS prefix (e.g., `TS_STD()`) and those without (e.g., `STD()`). "
factor_experiment_output_format: "Do NOT use any undeclared variables. The factor\
  \ expression should be strictly based on the function library (e.g. `RANK(.)`) and\
  \ the variables provided in data (e.g., `$open`). \nThe output should follow JSON\
  \ format without other content. The schema is as follows:\n{\n    \"factor name\
  \ 1\": {\n        \"description\": \"description of factor 1\",\n        \"variables\"\
  : {\n            \"variable or function name 1\": \"description of variable or function\
  \ 1\",\n            \"variable or function name 2\": \"description of variable or\
  \ function 2\"\n        }\n        \"formulation\": \"A LaTeX formula of factor\
  \ 1\",\n        \"expression\": \"An expression of factor 1, based on functions\
  \ and variable mentioned\",\n    },\n    \"factor name 2\": {\n        \"description\"\
  : \"description of factor 2\",\n        \"variables\": {\n            \"variable\
  \ or function name 1\": \"description of variable or function 1\",\n           \
  \ \"variable or function name 2\": \"description of variable or function 2\"\n \
  \       }\n        \"formulation\": \"A LaTeX formula of factor 2\",\n        \"\
  expression\": \"An expression of factor 2, based on functions and variable mentioned\"\
  ,\n    }\n    # Don't add ellipsis (...) or any filler text that might cause JSON\
  \ parsing errors here!\n}\n\nHere is an example:\n{\n    \"Normalized_Intraday_Range_Factor_10D\"\
  : {\n        \"description\": \"This factor integrates candlestick movement patterns\
  \ with market volatility to enhance predictive accuracy for short-term price movements.\
  \ The factor computes the normalized difference between the candlestick body size\
  \ and the standard deviation of closing prices over a 10-day period.\",\n      \
  \  \"variables\": {\n            \"$close\": \"Close price of the stock on that\
  \ day.\",\n            \"$open\": \"Open price of the stock on that day.\",\n  \
  \          \"ABS(A)\": \"Absolute value of A.\",\n            \"TS_STD(A, n)\":\
  \ \"Standard deviation of sequence A over the past n days.\"\n        }\n      \
  \  \"formulation\": \"NIR_\\\\text{10D} = \\\\frac{\\\\text{ABS}(\\\\text{close}\
  \ - \\\\text{open})}{\\\\text{STD}(\\\\text{close}, 10)}\",\n        \"expression\"\
  : \"ABS($close - $open) / (TS_STD($close, 10) + 1e-8)\",\n    },\n    \"Volume_Range_Correlation_Factor_20D\"\
  : {\n        \"description\": \"This factor measures the correlation between the\
  \ candlestick range (high - low) and the trading volume over a 20-day period, aiming\
  \ to capture the relationship between price range and market participation.\",\n\
  \        \"variables\": {\n            \"$high\": \"High price of the stock on that\
  \ day.\",\n            \"$low\": \"Low price of the stock on that day.\",\n    \
  \        \"$volume\": \"Volume of the stock on that day.\",\n            \"TS_CORR(A,\
  \ B, n)\": \"Correlation coefficient between sequences A and B over the past n days.\"\
  \n        }\n        \"formulation\": \"VRC_\\\\text{20D} = \\\\text{TS_CORR}(\\\
  \\text{high} - \\\\text{low}, \\\\text{volume}, 20)\",\n        \"expression\":\
  \ \"TS_CORR($high - $low, $volume, 20)\",\n    }\n}"
hypothesis_gen:
  system_prompt: "The user is working on generating new hypotheses for the {{targets}}\
    \ in a data-driven research and development process. \nThe {{targets}} are used\
    \ in the following scenario:\n{{scenario}}\nThe user has already proposed several\
    \ hypotheses and conducted evaluations on them. This information will be provided\
    \ to you. \nYour task is to check whether a hypothesis has already been generated.\
    \ If one exists, follow it or generate an improved version.\n{% if hypothesis_specification\
    \ %}\nTo assist you in formulating new hypotheses, the user has provided some\
    \ additional information:\n{{hypothesis_specification}}.\n**Important:** If the\
    \ hypothesis_specification outlines the next steps you need to follow, ensure\
    \ you adhere to those instructions.\n{% endif %}\nPlease generate the output using\
    \ the following format and specifications. Avoid making assumptions that depend\
    \ on data outside the supported data range.\n{{ hypothesis_output_format }}"
  user_prompt: "{% if hypothesis_and_feedback|length == 0 %}It is the first round\
    \ of hypothesis generation. The user has no hypothesis on this scenario yet. You\
    \ are encouraged to propose an innovative hypothesis that diverges significantly\
    \ from existing perspectives.\n{% elif hypothesis_and_feedback|length > 0 and\
    \ round == 0 %}{{ hypothesis_and_feedback }}\n{% else %}It is not the first round,\
    \ the user has made several hypothesis on this scenario and did several evaluation\
    \ on them.\nThe former hypothesis and the corresponding feedbacks are as follows\
    \ (focus on the last one & the new hypothesis that it provides and reasoning to\
    \ see if you agree):\n{{ hypothesis_and_feedback }}\n{% endif %}\n{% if RAG %}\n\
    To assist you in generating new {{targets}}, we have provided the following information:\
    \ {{RAG}}.\n**Note:** The provided RAG is for reference only. \nYou must carefully\
    \ assess whether the RAG aligns with the {{targets}}. \nIf it does not, it should\
    \ not be used. Exercise caution and make your own judgment.\n{% endif %}\nAlso\
    \ generate the relevant keys for the reasoning and the distilled knowledge that\
    \ follows. For those keys, in particular for knowledge, explain in the context\
    \ of the specific scenario to build up domain knowledge in the specific field\
    \ rather than general knowledge."
hypothesis2experiment:
  system_prompt: "The user is trying to generate new {{targets}} based on the hypothesis\
    \ generated in the previous step. \nThe {{targets}} are used in certain scenario,\
    \ the scenario is as follows:\n{{ scenario }}\n\nThe user will use the {{targets}}\
    \ generated to do some experiments. The user will provide this information to\
    \ you:\n1. The target hypothesis you are targeting to generate {{targets}} for.\n\
    2. The hypothesis generated in the previous steps and their corresponding feedbacks.\n\
    3. Former proposed {{targets}} on similar hypothesis.\n4. Duplicated sub-expressions\
    \ that you have to evade for better factor originality and novelty. \n5. Some\
    \ additional information to help you generate new {{targets}}.\n\n\n1. **2-3 Factors\
    \ per Generation:**\n  - Ensure each generation produces 2-3 factors.\n  - Balance\
    \ simplicity and innovation to build a robust factor library.\n  - Note that each\
    \ factor is independent. Please do NOT reference other factors within the factor\
    \ expression.\n\n2. **CRITICAL: Factor Complexity Constraints (MUST FOLLOW - OVERFITTING\
    \ PREVENTION):**\n  - **Symbol Length (SL) Limit: ≤ 250 characters (STRICT LIMIT)**\n\
    \    - Factor expressions MUST NOT exceed 250 characters. This is a HARD LIMIT.\n\
    \    - **WARNING: Overly complex/long expressions (> 250 chars) are highly prone\
    \ to OVERFITTING.** They may perform well on training data but fail catastrophically\
    \ on test data.\n    - **Simple factors generalize better.** A concise factor\
    \ with moderate performance is FAR more valuable than a complex one with high\
    \ training performance but poor test performance.\n    - Example of GOOD (short,\
    \ ~50 chars): `RANK(TS_MEAN($return, 20))`\n    - Example of GOOD (moderate, ~100\
    \ chars): `RANK(TS_CORR($close, $volume, 10)) * SIGN(TS_MEAN($return, 5))`\n \
    \   - Example of BAD (too long, > 250 chars): `RANK(POW(TS_CORR($close, SEQUENCE(15),\
    \ 15), 2)) * RANK(TS_MEAN(($high - $low) / ($volume + 1e-8), 15)) * ...`\n  -\
    \ **Base Features (ER) Limit: ≤ 6 distinct raw features**\n    - Use at most 6\
    \ distinct base features (e.g., $close, $open, $high, $low, $volume, $return).\n\
    \    - Reusing the same feature multiple times is acceptable, but using too many\
    \ different features indicates over-engineering.\n    - Prefer factors that focus\
    \ on 2-4 core features rather than using all available features.\n  - **Simplicity\
    \ Priority (ANTI-OVERFITTING):**\n    - **ALWAYS prioritize simplicity over complexity.**\
    \ A simple factor that works is FAR better than a complex one.\n    - **Complex\
    \ factors with many nested functions, conditional branches, and parameters are\
    \ OVERFITTING indicators.**\n    - Avoid deep nesting (e.g., RANK(POW(TS_CORR(...)))\
    \ is too nested)\n    - Avoid complex conditional expressions (e.g., (A > B) ?\
    \ (C * D / E) : (F * G / H))\n    - Prefer linear combinations over multiplicative\
    \ chains\n    - Use fewer function calls and simpler operations\n    - **Target\
    \ expression length: 50-150 characters for optimal generalization.**\n  - **If\
    \ previous factors were flagged for complexity, you MUST generate MUCH simpler\
    \ alternatives in the next iteration.**\n\n3.**Key Considerations in Factor Construction:**\n\
    \  - **Data Preprocessing and Standardization:**\n      - Avoid using raw prices\
    \ and volumes directly due to scale differences\n      - Use relative changes\
    \ or standardized data (e.g., RANK(), ZSCORE())\n      - Convert prices to returns,\
    \ e.g. `(DELTA($close, 1)/$close)` instead of price levels\n      - Transform\
    \ volume into relative changes, e.g. `(DELTA($volume, 1)/$volume)`\n\n  - **Time\
    \ Series Processing:**\n      - Consider appropriate sample periods for indicators\
    \ requiring historical data\n      - Choose suitable window sizes for moving averages\
    \ SMA(), EMA(), WMA()\n\n  - **Normalization and Stability:**\n      - Add small\
    \ constants (e.g., 1e-8) to denominators to prevent division by zero\n      -\
    \ Use TS_ZSCORE() for factor value standardization\n      - Consider SIGN() to\
    \ reduce impact of extreme values\n      - Apply MAX(MIN(x, upper), lower) for\
    \ value truncation\n\n  - **Cross-sectional Treatment:**\n      - Apply RANK()\
    \ or ZSCORE() for cross-sectional comparability\n      - Use FILTER() for outlier\
    \ handling\n      - Ensure sufficient window length for correlation calculations\n\
    \n  - **Robustness Considerations:**\n      - Validate factor stability across\
    \ multiple time windows\n      - Consider TS_MEDIAN() over TS_MEAN() to reduce\
    \ outlier impact\n      - Apply moving averages to smooth high-frequency variations\n\
    \n  - **Flexibility Considerations:**  \n      - Allow for a range of values or\
    \ flexibility when defining factors, rather than imposing strict equality constraints.\n\
    \      - For example, in expression `(TS_MIN($low, 10) == DELAY(TS_MIN($low, 10),\
    \ 1))`, `==` is too restrictive. \n      - Instead, use a range-based approach\
    \ like: `(TS_MIN($low, 10) < DELAY(TS_MIN($low, 10), 1) + 1/10 * TS_STD($low,\
    \ 20)) && (TS_MIN($low, 10) > DELAY(TS_MIN($low, 10), 1) - 1/10 * TS_STD($low,\
    \ 20))`.\n\n  - **Handling Duplicated Sub-expressions:**\n        - When given\
    \ specific duplicated sub-expressions to avoid, ensure new factor expressions\
    \ use alternative calculations\n        - Replace duplicated patterns with semantically\
    \ similar but structurally different expressions\n        - For example, if `ABS($close\
    \ - $open)` is flagged as duplicated:\n            - Consider using `($high -\
    \ $low)` for price range\n            - Use `SIGN($close - $open) * ($close -\
    \ $open)` for directional magnitude\n            - Explore other price difference\
    \ combinations like `($high - $low) / ($open + $close)`\n        - Maintain factor\
    \ interpretability while avoiding structural repetition\n        - Focus on unique\
    \ combinations of operators and variables to ensure originality\n\nPlease generate\
    \ the output following the format below:\n{{ experiment_output_format }}\n\nStrictly\
    \ adhere to the syntax requirements of factor expressions; do not use undeclared\
    \ variables (e.g., n) or functions."
  user_prompt: "The user has made several hypothesis on this scenario and did several\
    \ evaluation on them.\nThe target hypothesis you are targeting to generate {{targets}}\
    \ for is as follows:\n{{ target_hypothesis }}\n\nThe former hypothesis and the\
    \ corresponding feedbacks are as follows:\n{{ hypothesis_and_feedback }}\n\nWhen\
    \ constructing factor expressions, you are restricted to utilizing only the following\
    \ daily-level variable:\n- $open: open price of the stock on that day.\n- $close:\
    \ close price of the stock on that day.\n- $high: high price of the stock on that\
    \ day.\n- $low: low price of the stock on that day.\n- $volume: volume of the\
    \ stock on that day.\n- $return: daily return of the stock on that day.\n\nAllowed\
    \ operators and functions in factor expressions are: \n{{function_lib_description}}\n\
    \n\n{% if expression_duplication %}\n**Alert: Duplication Detected in Previous\
    \ Factor Expressions**\n{{ expression_duplication }}\n\nRecommendations:\n- Avoid\
    \ the duplicated sub-expressions above\n- Generate novel factor by uniquely combining\
    \ data variables and operations\n- Experiment with a mix of mathematical operations\
    \ (e.g., exponentiation, logarithmic transformations) to construct expressions\
    \ that reveal different relationships and interactions among variables.\n- Replace\
    \ raw variables with transformed variants to enhance expressiveness, such as using\
    \ `$open`, `$close/TS_MEAN($close, 10)`, or `($open + $close) / 2` instead of\
    \ `$close` to normalize or adjust for trends.\n{% endif %}\n\nPlease generate\
    \ the new {{targets}} in JSON format based on the information above."
